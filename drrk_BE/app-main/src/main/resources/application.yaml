spring:
  application:
    name: main
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

auth:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:14}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
