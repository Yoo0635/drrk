services:
  postgresql:
    image: postgres:16-alpine
    container_name: drrk-postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: drrk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: drrk-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  app-main:
    build:
      context: ./drrk_BE
      dockerfile: app-main/Dockerfile
    container_name: drrk-app-main
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgresql}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # Redis
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      # RabbitMQ
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      CONGESTION_CONSUMER_AUTO_STARTUP: ${CONGESTION_CONSUMER_AUTO_STARTUP:-true}
      INFERENCE_CONSUMER_AUTO_STARTUP: ${INFERENCE_CONSUMER_AUTO_STARTUP:-true}

      # Auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      # SMTP
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  app-collector:
    build:
      context: ./drrk_BE
      dockerfile: app-collector/Dockerfile
    container_name: drrk-app-collector
    environment:
      # RabbitMQ
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      # 단일 Collector scheduler
      AIRPORT_COLLECTION_ENABLED: ${AIRPORT_COLLECTION_ENABLED:-true}
      AIRPORT_COLLECTION_FIXED_DELAY: ${AIRPORT_COLLECTION_FIXED_DELAY:-PT5M}
      AIRPORT_COLLECTION_INITIAL_DELAY: ${AIRPORT_COLLECTION_INITIAL_DELAY:-PT1S}
      AIRPORT_API_NUM_OF_ROWS: ${AIRPORT_API_NUM_OF_ROWS:-1000}

      # 인천공항 OpenAPI
      AIRPORT_ARRIVAL_STATUS_API_URL: ${AIRPORT_ARRIVAL_STATUS_API_URL:?AIRPORT_ARRIVAL_STATUS_API_URL is required}
      AIRPORT_ARRIVAL_STATUS_API_KEY: ${AIRPORT_ARRIVAL_STATUS_API_KEY:?AIRPORT_ARRIVAL_STATUS_API_KEY is required}
      AIRPORT_PASSENGER_FORECAST_API_URL: ${AIRPORT_PASSENGER_FORECAST_API_URL:?AIRPORT_PASSENGER_FORECAST_API_URL is required}
      AIRPORT_PASSENGER_FORECAST_API_KEY: ${AIRPORT_PASSENGER_FORECAST_API_KEY:?AIRPORT_PASSENGER_FORECAST_API_KEY is required}
      AIRPORT_RAILROAD_API_URL: ${AIRPORT_RAILROAD_API_URL:?AIRPORT_RAILROAD_API_URL is required}
      AIRPORT_RAILROAD_API_KEY: ${AIRPORT_RAILROAD_API_KEY:?AIRPORT_RAILROAD_API_KEY is required}
      AIRPORT_RAILROAD_TRAIN_CLASS: ${AIRPORT_RAILROAD_TRAIN_CLASS:-}
      AIRPORT_RAILROAD_STATION_CODE: ${AIRPORT_RAILROAD_STATION_CODE:-}

      # 모델 입력 및 혼잡도 계산
      INFERENCE_CONSUMER_AUTO_STARTUP: ${INFERENCE_CONSUMER_AUTO_STARTUP:-true}
      CONGESTION_CALCULATION_ENABLED: ${CONGESTION_CALCULATION_ENABLED:-true}
      CONGESTION_CALCULATION_FIXED_RATE: ${CONGESTION_CALCULATION_FIXED_RATE:-PT10S}
      CONGESTION_CALCULATION_INITIAL_DELAY: ${CONGESTION_CALCULATION_INITIAL_DELAY:-PT10S}
      CONGESTION_API_MAX_AGE: ${CONGESTION_API_MAX_AGE:-PT10M}
      CONGESTION_MODEL_MAX_AGE: ${CONGESTION_MODEL_MAX_AGE:-PT10S}
      CONGESTION_MOVING_WALKWAY_ENABLED: ${CONGESTION_MOVING_WALKWAY_ENABLED:-true}
      CONGESTION_SENSOR_SPACE_ID: ${CONGESTION_SENSOR_SPACE_ID:?CONGESTION_SENSOR_SPACE_ID is required}
      CONGESTION_PUBLISH_CONFIRM_TIMEOUT: ${CONGESTION_PUBLISH_CONFIRM_TIMEOUT:-PT2S}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgresql-data:
  rabbitmq-data:
  redis-data:
