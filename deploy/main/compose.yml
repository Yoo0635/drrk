services:
  nginx:
    image: nginx:1.27-alpine
    container_name: drrk-main-nginx
    restart: unless-stopped
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN is required}
      NGINX_ENVSUBST_FILTER: "^ROOT_DOMAIN$"
    ports:
      - "80:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      app-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - drrk-main

  app-main:
    image: ${APP_MAIN_IMAGE:?APP_MAIN_IMAGE is required}
    container_name: drrk-app-main
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD is required}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:?SPRING_RABBITMQ_HOST is required}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:?SPRING_RABBITMQ_USERNAME is required}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:?SPRING_RABBITMQ_PASSWORD is required}
      CONGESTION_CONSUMER_AUTO_STARTUP: ${CONGESTION_CONSUMER_AUTO_STARTUP:-true}
      INFERENCE_CONSUMER_AUTO_STARTUP: ${INFERENCE_CONSUMER_AUTO_STARTUP:-true}
      INFERENCE_STREAM_FIXED_RATE: ${INFERENCE_STREAM_FIXED_RATE:-PT5S}
      INFERENCE_STREAM_EMITTER_TIMEOUT: ${INFERENCE_STREAM_EMITTER_TIMEOUT:-PT30M}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - drrk-main

  redis:
    image: redis:7-alpine
    container_name: drrk-main-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD is required}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - drrk-main

networks:
  drrk-main:
    name: drrk-main

volumes:
  redis-data:
