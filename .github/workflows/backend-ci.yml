name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "drrk_BE/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "drrk_BE/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-test:
    name: Backend Gradle tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend tests
        working-directory: drrk_BE
        run: |
          chmod +x ./gradlew
          ./gradlew :common:test :main:test :collector:test --no-daemon

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Build backend images
        run: docker compose build app-main app-collector
