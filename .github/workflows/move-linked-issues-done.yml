name: 연결 이슈 Done 처리

on:
  pull_request:
    branches: [develop]
    types: [closed]

jobs:
  move-linked-issues-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PROJECT_ACCESS_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}

    steps:
      - name: 연결 이슈의 프로젝트 상태를 Done으로 변경
        if: ${{ env.PROJECT_ACCESS_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PROJECT_ACCESS_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const closingKeywordPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = [...body.matchAll(closingKeywordPattern)]
              .map((match) => Number(match[1]))
              .filter((issueNumber, index, issueNumbers) => issueNumbers.indexOf(issueNumber) === index);

            if (issueNumbers.length === 0) {
              core.info('PR body에서 close/fix/resolve 이슈 번호를 찾지 못했습니다.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const issueNumber of issueNumbers) {
              const issueResult = await github.graphql(`
                query($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issueNumber) {
                      id
                      number
                      projectItems(first: 20) {
                        nodes {
                          id
                          project {
                            id
                            title
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner, repo, issueNumber });

              const issue = issueResult.repository.issue;
              const projectItems = issue.projectItems.nodes;

              if (projectItems.length === 0) {
                core.warning(`#${issueNumber} 이슈에 연결된 Project item이 없습니다.`);
                continue;
              }

              for (const projectItem of projectItems) {
                const projectResult = await github.graphql(`
                  query($projectId: ID!) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        id
                        title
                        fields(first: 50) {
                          nodes {
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                              options {
                                id
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { projectId: projectItem.project.id });

                const project = projectResult.node;
                const statusField = project.fields.nodes.find((field) => field && field.name === 'Status');

                if (!statusField) {
                  core.warning(`${project.title} 프로젝트에 Status 필드가 없습니다.`);
                  continue;
                }

                const doneOption = statusField.options.find((option) => option.name === 'Done');

                if (!doneOption) {
                  core.warning(`${project.title} 프로젝트 Status 필드에 Done 옵션이 없습니다.`);
                  continue;
                }

                await github.graphql(`
                  mutation(
                    $projectId: ID!,
                    $itemId: ID!,
                    $fieldId: ID!,
                    $optionId: String!
                  ) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId,
                      itemId: $itemId,
                      fieldId: $fieldId,
                      value: {
                        singleSelectOptionId: $optionId
                      }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `, {
                  projectId: project.id,
                  itemId: projectItem.id,
                  fieldId: statusField.id,
                  optionId: doneOption.id,
                });

                core.info(`#${issueNumber} 이슈를 ${project.title} 프로젝트의 Done으로 변경했습니다.`);
              }
            }

      - name: PROJECT_ACCESS_TOKEN 누락 안내
        if: ${{ env.PROJECT_ACCESS_TOKEN == '' }}
        run: echo "PROJECT_ACCESS_TOKEN secret이 없어 프로젝트 상태를 변경하지 않았습니다."
