name: Backend Debug Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation"
        required: true
        default: "diagnose-main"
        type: choice
        options:
          - diagnose-main
          - diagnose-collector
          - inject-model-data
          - set-env
          - aws-probe
      count:
        description: "inject-model-data: number of messages"
        required: false
        default: "30"
      interval:
        description: "inject-model-data: seconds between messages"
        required: false
        default: "5"
      env_target:
        description: "set-env: main or collector"
        required: false
        default: "main"
      env_kv:
        description: "set-env: KEY=VALUE to upsert into env file (app restarts)"
        required: false
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  ops:
    name: Run ops on EC2 via SSM
    runs-on: ubuntu-latest
    environment: ${{ (github.event.inputs.action == 'diagnose-collector' || github.event.inputs.action == 'inject-model-data' || github.event.inputs.env_target == 'collector') && 'collector' || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS probe (runner-side, no SSM)
        if: ${{ github.event.inputs.action == 'aws-probe' }}
        run: |
          set +e
          echo "== identity =="; aws sts get-caller-identity
          echo "== cloudfront distributions =="
          aws cloudfront list-distributions --query "DistributionList.Items[].{Id:Id,Domain:DomainName,Aliases:Aliases.Items,Origins:Origins.Items[].DomainName}" --output json
          echo "== s3 buckets =="; aws s3 ls
          echo "== route53 zones =="; aws route53 list-hosted-zones --query "HostedZones[].Name" --output json
          echo "== ec2 (drrk) =="
          aws ec2 describe-instances --query "Reservations[].Instances[].{Id:InstanceId,PublicIp:PublicIpAddress,PrivateIp:PrivateIpAddress,State:State.Name,Name:Tags[?Key=='Name']|[0].Value}" --output json
          exit 0

      - name: Build ops script
        id: build
        if: ${{ github.event.inputs.action != 'aws-probe' }}
        run: |
          set -euo pipefail
          ACTION="${{ github.event.inputs.action }}"
          case "$ACTION" in
            diagnose-main)
              cp deploy/ops/diagnose-main.sh /tmp/ops.sh
              echo "instance=${{ vars.MAIN_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
              ;;
            diagnose-collector)
              cp deploy/ops/diagnose-collector.sh /tmp/ops.sh
              echo "instance=${{ vars.COLLECTOR_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
              ;;
            inject-model-data)
              {
                echo "export INJECT_COUNT='${{ github.event.inputs.count }}'"
                echo "export INJECT_INTERVAL='${{ github.event.inputs.interval }}'"
                cat deploy/ops/inject-model-data.sh
              } > /tmp/ops.sh
              echo "instance=${{ vars.COLLECTOR_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
              ;;
            set-env)
              KV="${{ github.event.inputs.env_kv }}"
              TARGET="${{ github.event.inputs.env_target }}"
              if ! printf '%s' "$KV" | grep -Eq '^[A-Z][A-Z0-9_]*=[^;&|<>`$]*$'; then
                echo "invalid env_kv" >&2; exit 1
              fi
              KEY="${KV%%=*}"
              {
                echo "set -eu"
                echo "ENV_FILE=/opt/drrk/env/${TARGET}.env"
                echo "APP=app-${TARGET}"
                echo "COMPOSE=/opt/drrk/${TARGET}/compose.yml"
                echo "if grep -q '^${KEY}=' \"\$ENV_FILE\"; then sudo sed -i -E 's|^${KEY}=.*|${KV}|' \"\$ENV_FILE\"; else printf '%s\n' '${KV}' | sudo tee -a \"\$ENV_FILE\" >/dev/null; fi"
                echo "grep -c '^${KEY}=' \"\$ENV_FILE\""
                echo "docker compose --env-file \"\$ENV_FILE\" -f \"\$COMPOSE\" up -d --no-deps \"\$APP\""
                echo "sleep 20"
                echo "docker compose --env-file \"\$ENV_FILE\" -f \"\$COMPOSE\" exec -T \"\$APP\" curl -fsS -m 5 http://localhost:8080/healthz && echo HEALTHY"
              } > /tmp/ops.sh
              if [ "$TARGET" = "collector" ]; then
                echo "instance=${{ vars.COLLECTOR_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
              else
                echo "instance=${{ vars.MAIN_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "unknown action" >&2; exit 1
              ;;
          esac
          echo "---- ops script ----"
          cat /tmp/ops.sh

      - name: Send SSM command and print output
        if: ${{ github.event.inputs.action != 'aws-probe' }}
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.build.outputs.instance }}"
          B64=$(base64 -w0 /tmp/ops.sh)
          PARAMS=$(jq -n --arg b64 "$B64" '{commands: [("echo " + $b64 + " | base64 -d > /tmp/drrk-ops.sh"), "bash /tmp/drrk-ops.sh"], executionTimeout: ["600"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "drrk debug ops ${{ github.event.inputs.action }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "command_id=$command_id"
          for attempt in $(seq 1 130); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo "Pending")
            case "$status" in
              Success|Failed|Cancelled|TimedOut)
                echo "===== STATUS: $status ====="
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent --output text
                echo "===== STDERR ====="
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text
                [ "$status" = "Success" ] && exit 0 || exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done
          echo "SSM command timed out" >&2
          exit 1
