name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - main
          - collector

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push:
    name: Build and push backend images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push selected images
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.target }}" = "both" ] || [ "${{ github.event.inputs.target }}" = "main" ]; then
            docker build -f drrk_BE/app-main/Dockerfile -t "${DOCKERHUB_NAMESPACE}/drrk-app-main:${IMAGE_TAG}" drrk_BE
            docker push "${DOCKERHUB_NAMESPACE}/drrk-app-main:${IMAGE_TAG}"
          fi

          if [ "${{ github.event.inputs.target }}" = "both" ] || [ "${{ github.event.inputs.target }}" = "collector" ]; then
            docker build -f drrk_BE/app-collector/Dockerfile -t "${DOCKERHUB_NAMESPACE}/drrk-app-collector:${IMAGE_TAG}" drrk_BE
            docker push "${DOCKERHUB_NAMESPACE}/drrk-app-collector:${IMAGE_TAG}"
          fi

  deploy-main:
    name: Deploy Main EC2
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'main' }}
    environment: main
    env:
      APP_MAIN_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/drrk-app-main:${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run SSM blue-green deploy command
        run: |
          set -euo pipefail

          commands_file="$(mktemp)"
          jq -n '[]' > "$commands_file"

          add_command() {
            command="$1"
            tmp="$(mktemp)"
            jq --arg command "$command" '. + [$command]' "$commands_file" > "$tmp"
            mv "$tmp" "$commands_file"
          }

          add_file() {
            source_path="$1"
            target_path="$2"
            mode="$3"
            remote_b64="/tmp/drrk-$(basename "$target_path").b64"

            add_command "rm -f '$remote_b64'"
            base64 -w0 "$source_path" | fold -w 3500 | while IFS= read -r chunk; do
              add_command "printf '%s' '$chunk' >> '$remote_b64'"
            done
            add_command "sudo mkdir -p '$(dirname "$target_path")'"
            add_command "base64 -d '$remote_b64' | sudo tee '$target_path' >/dev/null"
            add_command "sudo chmod '$mode' '$target_path'"
            add_command "rm -f '$remote_b64'"
          }

          add_command "set -eu"
          add_command "test -f /opt/drrk/env/main.env"
          add_command "sudo mkdir -p /opt/drrk/main/nginx/templates /opt/drrk/main/nginx/conf.d /opt/drrk/main/scripts"

          add_file "deploy/main/compose.yml" "/opt/drrk/main/compose.yml" "0644"
          add_file "deploy/main/nginx/templates/api.conf.template" "/opt/drrk/main/nginx/templates/api.conf.template" "0644"
          add_file "deploy/main/scripts/blue-green-lib.sh" "/opt/drrk/main/scripts/blue-green-lib.sh" "0755"
          add_file "deploy/main/scripts/deploy-blue-green.sh" "/opt/drrk/main/scripts/deploy-blue-green.sh" "0755"
          add_file "deploy/main/scripts/rollback-blue-green.sh" "/opt/drrk/main/scripts/rollback-blue-green.sh" "0755"
          add_command "sudo /opt/drrk/main/scripts/deploy-blue-green.sh '${{ env.APP_MAIN_IMAGE }}'"

          jq -n \
            --arg instance "${{ vars.MAIN_INSTANCE_ID }}" \
            --arg comment "Deploy drrk main ${{ github.sha }} blue-green" \
            --slurpfile commands "$commands_file" \
            '{
              InstanceIds: [$instance],
              DocumentName: "AWS-RunShellScript",
              Comment: $comment,
              Parameters: {
                commands: $commands[0]
              }
            }' > ssm-main.json

          command_id="$(aws ssm send-command \
            --cli-input-json file://ssm-main.json \
            --query "Command.CommandId" \
            --output text)"
          for attempt in $(seq 1 120); do
            if ! status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.MAIN_INSTANCE_ID }}" --query Status --output text 2>/dev/null)"; then
              sleep 5
              continue
            fi
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.MAIN_INSTANCE_ID }}" \
                  --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
                  --output json
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.MAIN_INSTANCE_ID }}" \
                  --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
                  --output json || true
                exit 1
                ;;
            esac
          done
          echo "SSM deploy command timed out after 10 minutes" >&2
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.MAIN_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json || true
          exit 1

  deploy-collector:
    name: Deploy Collector EC2
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'collector' }}
    environment: collector
    env:
      APP_COLLECTOR_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/drrk-app-collector:${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run SSM deploy command
        run: |
          set -euo pipefail
          cat > ssm-collector.json <<'JSON'
          {
            "InstanceIds": ["${{ vars.COLLECTOR_INSTANCE_ID }}"],
            "DocumentName": "AWS-RunShellScript",
            "Comment": "Deploy drrk collector ${{ github.sha }}",
            "Parameters": {
              "commands": [
                "set -eu",
                "test -f /opt/drrk/collector/compose.yml",
                "test -f /opt/drrk/env/collector.env",
                "previous_image=$(sed -n 's/^APP_COLLECTOR_IMAGE=//p' /opt/drrk/env/collector.env)",
                "test -n \"$previous_image\"",
                "rollback() { sudo sed -i -E \"s|^APP_COLLECTOR_IMAGE=.*|APP_COLLECTOR_IMAGE=${previous_image}|\" /opt/drrk/env/collector.env; docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml up -d --no-deps app-collector; }",
                "trap rollback 0",
                "sudo sed -i.bak -E 's|^APP_COLLECTOR_IMAGE=.*|APP_COLLECTOR_IMAGE=${{ env.APP_COLLECTOR_IMAGE }}|' /opt/drrk/env/collector.env",
                "docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml pull app-collector",
                "docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml up -d rabbitmq",
                "docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml up -d --no-deps app-collector",
                "for attempt in $(seq 1 30); do if docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml exec -T app-collector curl -fsS http://localhost:8080/healthz >/dev/null; then trap - 0; exit 0; fi; sleep 2; done; exit 1"
              ]
            }
          }
          JSON
          command_id="$(aws ssm send-command \
            --cli-input-json file://ssm-collector.json \
            --query "Command.CommandId" \
            --output text)"
          for attempt in $(seq 1 120); do
            if ! status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.COLLECTOR_INSTANCE_ID }}" --query Status --output text 2>/dev/null)"; then
              sleep 5
              continue
            fi
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.COLLECTOR_INSTANCE_ID }}" \
                  --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
                  --output json
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.COLLECTOR_INSTANCE_ID }}" \
                  --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
                  --output json || true
                exit 1
                ;;
            esac
          done
          echo "SSM deploy command timed out after 10 minutes" >&2
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.COLLECTOR_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json || true
          exit 1
