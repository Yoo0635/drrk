name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - main
          - collector

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push:
    name: Build and push backend images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push selected images
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.target }}" = "both" ] || [ "${{ github.event.inputs.target }}" = "main" ]; then
            docker build -f drrk_BE/app-main/Dockerfile -t "${DOCKERHUB_NAMESPACE}/drrk-app-main:${IMAGE_TAG}" drrk_BE
            docker push "${DOCKERHUB_NAMESPACE}/drrk-app-main:${IMAGE_TAG}"
          fi

          if [ "${{ github.event.inputs.target }}" = "both" ] || [ "${{ github.event.inputs.target }}" = "collector" ]; then
            docker build -f drrk_BE/app-collector/Dockerfile -t "${DOCKERHUB_NAMESPACE}/drrk-app-collector:${IMAGE_TAG}" drrk_BE
            docker push "${DOCKERHUB_NAMESPACE}/drrk-app-collector:${IMAGE_TAG}"
          fi

  deploy-main:
    name: Deploy Main EC2
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'main' }}
    environment: main
    env:
      APP_MAIN_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/drrk-app-main:${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run SSM deploy command
        run: |
          set -euo pipefail
          cat > ssm-main.json <<'JSON'
          {
            "InstanceIds": ["${{ vars.MAIN_INSTANCE_ID }}"],
            "DocumentName": "AWS-RunShellScript",
            "Comment": "Deploy drrk main ${{ github.sha }}",
            "Parameters": {
              "commands": [
                "set -euo pipefail",
                "test -f /opt/drrk/main/compose.yml",
                "test -f /opt/drrk/env/main.env",
                "previous_image=$(grep '^APP_MAIN_IMAGE=' /opt/drrk/env/main.env | cut -d= -f2-)",
                "rollback() { sudo sed -i -E \"s|^APP_MAIN_IMAGE=.*|APP_MAIN_IMAGE=${previous_image}|\" /opt/drrk/env/main.env; docker compose --env-file /opt/drrk/env/main.env -f /opt/drrk/main/compose.yml up -d --no-deps app-main; }",
                "trap rollback ERR",
                "sudo sed -i.bak -E 's|^APP_MAIN_IMAGE=.*|APP_MAIN_IMAGE=${{ env.APP_MAIN_IMAGE }}|' /opt/drrk/env/main.env",
                "docker compose --env-file /opt/drrk/env/main.env -f /opt/drrk/main/compose.yml pull app-main",
                "docker compose --env-file /opt/drrk/env/main.env -f /opt/drrk/main/compose.yml up -d redis",
                "docker compose --env-file /opt/drrk/env/main.env -f /opt/drrk/main/compose.yml up -d --no-deps app-main",
                "docker compose --env-file /opt/drrk/env/main.env -f /opt/drrk/main/compose.yml up -d nginx",
                "for attempt in $(seq 1 30); do if docker compose --env-file /opt/drrk/env/main.env -f /opt/drrk/main/compose.yml exec -T app-main curl -fsS http://localhost:8080/healthz >/dev/null; then trap - ERR; exit 0; fi; sleep 2; done; rollback; exit 1"
              ]
            }
          }
          JSON
          command_id="$(aws ssm send-command \
            --cli-input-json file://ssm-main.json \
            --query "Command.CommandId" \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ vars.MAIN_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.MAIN_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json

  deploy-collector:
    name: Deploy Collector EC2
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'collector' }}
    environment: collector
    env:
      APP_COLLECTOR_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/drrk-app-collector:${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run SSM deploy command
        run: |
          set -euo pipefail
          cat > ssm-collector.json <<'JSON'
          {
            "InstanceIds": ["${{ vars.COLLECTOR_INSTANCE_ID }}"],
            "DocumentName": "AWS-RunShellScript",
            "Comment": "Deploy drrk collector ${{ github.sha }}",
            "Parameters": {
              "commands": [
                "set -euo pipefail",
                "test -f /opt/drrk/collector/compose.yml",
                "test -f /opt/drrk/env/collector.env",
                "previous_image=$(grep '^APP_COLLECTOR_IMAGE=' /opt/drrk/env/collector.env | cut -d= -f2-)",
                "rollback() { sudo sed -i -E \"s|^APP_COLLECTOR_IMAGE=.*|APP_COLLECTOR_IMAGE=${previous_image}|\" /opt/drrk/env/collector.env; docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml up -d --no-deps app-collector; }",
                "trap rollback ERR",
                "sudo sed -i.bak -E 's|^APP_COLLECTOR_IMAGE=.*|APP_COLLECTOR_IMAGE=${{ env.APP_COLLECTOR_IMAGE }}|' /opt/drrk/env/collector.env",
                "docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml pull app-collector",
                "docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml up -d rabbitmq",
                "docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml up -d --no-deps app-collector",
                "for attempt in $(seq 1 30); do if docker compose --env-file /opt/drrk/env/collector.env -f /opt/drrk/collector/compose.yml exec -T app-collector curl -fsS http://localhost:8080/healthz >/dev/null; then trap - ERR; exit 0; fi; sleep 2; done; rollback; exit 1"
              ]
            }
          }
          JSON
          command_id="$(aws ssm send-command \
            --cli-input-json file://ssm-collector.json \
            --query "Command.CommandId" \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ vars.COLLECTOR_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.COLLECTOR_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json
